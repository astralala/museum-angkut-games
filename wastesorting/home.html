<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Pilah Sampah</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preload" as="image" href="assets/bg/bghome.png" />
  </head>
  <body>
    <div id="frame" class="hm">
      <div class="topblur"></div>
      <img class="el logo" src="assets/elements/logo_toyota_berbagi.png" alt="Toyota Berbagi" />
      <img class="el title" src="assets/elements/titlehome.png" alt="Waste Sorting Hub" />
      <button
        class="el play"
        aria-label="Touch to Play"
        onclick="SFX.click();S.reset();goTo('introduction.html')"
      ></button>
      <img class="el tabs" src="assets/elements/3columnhometab.png" alt="" />
      <video
        id="intro"
        src="assets/videos/introhome.mp4"
        poster="assets/bg/bghomenocar.png"
        muted
        autoplay
        playsinline
        preload="auto"
      ></video>
      <script>
        window.CFG = {};
      </script>
      <script src="js/common.js"></script>
      <script>
        const fr = document.getElementById("frame"),
          vid = document.getElementById("intro");
        let done = false;
        function reveal() {
          if (done) return;
          done = true;
          fr.classList.add("go");
          setTimeout(() => vid.remove(), 1000);
        }
        vid.addEventListener("ended", reveal);
        vid.addEventListener("error", reveal);
        /* sentuh layar saat video = lewati */
        vid.addEventListener("pointerdown", reveal);
        /* cadangan: kalau video tidak bisa diputar otomatis / macet */
        vid.play().catch((e) => {
          if (e.name === "NotAllowedError") reveal();
        });
        document.addEventListener("visibilitychange", () => {
          if (!document.hidden && !done) vid.play().catch(() => {});
        });
        setTimeout(reveal, 9000);
      </script>
    </div>
  </body>
</html>
