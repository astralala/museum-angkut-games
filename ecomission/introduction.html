<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eco Mission Challenge - Pengantar</title>
    <link rel="stylesheet" href="css/introduction.css" />
    <script src="bgm.js"></script>
  </head>
  <body class="loading">
    <div id="stage">
      <img id="title" src="assets/pengantar_title.png" alt="Masa depan butuh bantuanmu! The future needs your help!" />
      <img class="tabIntro c1" src="assets/tab_introduction.png" alt="Polusi udara" />
      <img class="tabIntro c2" src="assets/tab_introduction.png" alt="Banyak sampah" />
      <img class="tabIntro c3" src="assets/tab_introduction.png" alt="Kerusakan alam" />
      <iframe id="maskot" src="bubum/sedih.html" title="Maskot Bubum" scrolling="no" allowtransparency="true"></iframe>
      <button id="continue" aria-label="Continue"></button>
      <div id="veil"></div>
    </div>

    <script src="sfx.js"></script>
    <script>
      // Scaling responsif: jaga rasio 16:9, muat di layar berapa pun resolusinya
      function fit() {
        const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        document.documentElement.style.setProperty("--scale", s);
      }
      window.addEventListener("resize", fit);
      fit();

      // `load` menunggu semua gambar dan iframe; baru setelah itu buka kaca buram dan mulai urutan animasi
      window.addEventListener("load", () => document.body.classList.remove("loading"));

      // Bunyi "tip" (sfx.js) lalu ke halaman pilih game
      document.getElementById("continue").addEventListener("click", () => clickGo("choose_game.html"));
    </script>
  </body>
</html>
