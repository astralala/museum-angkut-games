<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eco Mission Challenge</title>
    <link rel="stylesheet" href="css/index.css" />
    <script src="bgm.js"></script>
  </head>
  <body class="loading">
    <div id="stage">
      <img id="logo" src="assets/logo_toyota_berbagi.png" alt="Toyota Berbagi" />
      <img id="title" src="assets/title.png" alt="Eco Mission Challenge" />
      <iframe id="maskot" src="bubum/home.html" title="Maskot Bubum" scrolling="no" allowtransparency="true"></iframe>
      <img id="bubble" src="assets/bubblespeech_home.png" alt="Yuk, pilih misi yang ingin kamu mainkan!" />
      <img class="tabs c1" src="assets/3_tab.png" alt="" />
      <img class="tabs c2" src="assets/3_tab.png" alt="" />
      <img class="tabs c3" src="assets/3_tab.png" alt="" />

      <button id="play" aria-label="Play"></button>
      <button id="scanqr" aria-label="Scan QR kamu di kamera untuk bermain"></button>
      <div id="veil"></div>
    </div>

    <script src="preload-list.js"></script>
    <script src="preload.js"></script>

    <script src="sheet-local.js"></script>

    <script src="sfx.js"></script>
    <script>
      // Scaling responsif: jaga rasio 16:9, muat di layar berapa pun resolusinya
      function fit() {
        const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        document.documentElement.style.setProperty("--scale", s);
      }
      window.addEventListener("resize", fit);
      fit();

      // Tunggu preloader (semua aset game di-cache) dan `load` halaman; baru buka kaca buram dan mulai animasi
      window.PRELOAD_DONE.then(() => document.body.classList.remove("loading"));

      // Bunyi "tik" (sfx.js) lalu ke halaman pilih umur
      document.getElementById("play").addEventListener("click", () => clickGo("select_age.html"));
    </script>
  </body>
</html>
