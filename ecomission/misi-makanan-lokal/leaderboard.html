<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Leaderboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <script src="sfx.js"></script>
    <script src="../bgm.js"></script>
  </head>
  <body>
    <main class="stage">
      <div class="card center" style="max-width: 640px; margin: auto">
        <div class="mascot" style="font-size: 4rem">🏆</div>
        <h2>Leaderboard</h2>
        <p style="margin: 0">Jarak transportasi paling pendek = peringkat terbaik</p>
        <div id="lb" style="text-align: left; margin: 12px 0"></div>
        <a class="btn" href="index.html">NEXT ➜</a>
      </div>
    </main>
    <script src="data.js"></script>
    <script>
      const lb = JSON.parse(localStorage.getItem("mml_leaderboard") || "[]")
          .sort((a, b) => a.km - b.km || a.id - b.id)
          .slice(0, 10),
        last = localStorage.getItem("mml_last_id");
      const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
      document.getElementById("lb").innerHTML = lb.length
        ? lb
            .map(
              (r, i) =>
                `<div class="row" style="${String(r.id) === last ? "outline:3px solid #2eaa4a" : ""}"><span>${["🥇", "🥈", "🥉"][i] || i + 1 + "."} ${esc(r.nama)}</span><span class="km ${r.km <= THRESHOLD ? "ok" : "no"}">${r.km.toLocaleString("id-ID")} km</span></div>`,
            )
            .join("")
        : '<p class="center">Belum ada data.</p>';
      setTimeout(() => SFX.coin(), 300);
    </script>
  </body>
</html>
