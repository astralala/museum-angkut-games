<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tahukah Kamu?</title>
    <script src="sfx.js"></script>
    <link rel="stylesheet" href="css/tahukah-kamu.css" />
    <script src="../bgm.js"></script>
  </head>
  <body class="loading">
    <div id="stage">
      <img
        id="info"
        src="assets/tahukan_title_design.png"
        alt="Tahukah kamu? Makanan lokal jaraknya lebih dekat. Did you know? Local food travels less."
      />
      <iframe
        id="maskot"
        src="../bubum/tunjuk.html"
        title="Maskot Bubum"
        scrolling="no"
        allowtransparency="true"
      ></iframe>
      <button id="continue" class="btn" aria-label="Continue"></button>
      <div id="veil"></div>
    </div>

    <script>
      // Scaling responsif: jaga rasio 16:9, muat di layar berapa pun resolusinya
      function fit() {
        const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        document.documentElement.style.setProperty("--scale", s);
      }
      window.addEventListener("resize", fit);
      fit();

      // `load` menunggu semua gambar dan iframe; baru setelah itu buka kaca buram
      window.addEventListener("load", () => document.body.classList.remove("loading"));

      document.getElementById("continue").addEventListener("click", () => {
        goTo("nama.html");
      });
    </script>
  </body>
</html>
