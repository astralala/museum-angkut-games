<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cara Bermain</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="sfx.js"></script>
    <link rel="stylesheet" href="css/cara-bermain.css" />
    <script src="../bgm.js"></script>
  </head>
  <body class="loading">
    <div id="stage">
      <!-- Panel desain jadi (assets/tujuan_misi.png & assets/cara-main.png) -->
      <img
        class="card-img"
        id="img-tujuan"
        src="assets/tujuan_misi.png"
        alt="Tujuan Misimu: susun satu piring makanan yang sehat dan seimbang, jejak karbon rendah, dan ramah lingkungan."
      />
      <img
        class="card-img"
        id="img-cara"
        src="assets/cara-main.png"
        alt="Cara Bermain: pilih makanan, seret ke piring, lihat meter, tetap hijau."
      />

      <img class="bubble" src="assets/bubble-siap.png" alt="Siap jadi pahlawan bumi?" />
      <iframe
        id="maskot"
        src="../bubum/home2.html"
        title="Maskot Bubum"
        scrolling="no"
        allowtransparency="true"
      ></iframe>
      <button class="btn" id="go" aria-label="Play"></button>
      <div id="veil"></div>
    </div>

    <script>
      // Scaling responsif: jaga rasio 16:9, muat di layar berapa pun resolusinya
      function fit() {
        const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        document.documentElement.style.setProperty("--scale", s);
      }
      window.addEventListener("resize", fit);
      fit();

      // `load` menunggu semua gambar dan iframe; baru setelah itu buka kaca buram
      window.addEventListener("load", () => document.body.classList.remove("loading"));

      document.getElementById("go").addEventListener("click", () => {
        goTo("gameplay.html");
      });
    </script>
  </body>
</html>
