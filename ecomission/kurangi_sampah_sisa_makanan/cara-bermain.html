<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cara Bermain</title>
    <link rel="stylesheet" href="css/cara-bermain.css" />
    <link rel="stylesheet" href="css/loading.css" />
    <script src="../bgm.js"></script>
  </head>
  <body class="loading">
    <div id="stage" class="stage">
      <button id="play" class="btn" aria-label="Play"></button>
      <div id="veil"></div>
    </div>

    <script src="common.js"></script>
    <script>
      // Scaling responsif: jaga rasio 16:9, muat di layar berapa pun resolusinya
      function fit() {
        const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        document.documentElement.style.setProperty("--scale", s);
      }
      window.addEventListener("resize", fit);
      fit();

      S.set("score", 0);
      S.set("level", 1);
      document.getElementById("play").addEventListener("click", () => {
        goTo("game.html");
      });
    </script>
  </body>
</html>
